[workspace]
members = ["apps/local-server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LicenseRef-SynapseGit-LP-Studio-Evaluation"
publish = false
repository = "https://github.com/howlrs/synapsegit-lp-studio"
rust-version = "1.95"

[workspace.dependencies]
axum = "0.8.8"
base64 = "0.22.1"
getrandom = "0.4.2"
fs2 = "0.4.3"
http = "1.4.0"
libc = "0.2.183"
mime_guess = "2.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
synapse-artifact = { git = "https://github.com/howlrs/synapsegit", rev = "7ddb58b2ad585db3823431135ae33222d4704f9f" }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "compression-gzip", "fs", "request-id", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.8"
unicode-normalization = "0.1.25"
unicase = "2.9.0"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }
