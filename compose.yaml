name: synapsegit-lp-studio

services:
  studio:
    platform: linux/amd64
    image: synapsegit-lp-studio:local
    build:
      context: .
      args:
        VERSION: local
        REVISION: local
    init: true
    restart: "no"
    user: "65532:65532"
    ports:
      - name: editor
        target: 4173
        published: "4173"
        host_ip: 127.0.0.1
        protocol: tcp
      - name: preview
        target: 4174
        published: "4174"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      LP_STUDIO_OPENAI_MODEL:
    volumes:
      - type: volume
        source: studio-state
        target: /var/lib/synapsegit-lp-studio
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/synapsegit-lp-local-server
        - --healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s

volumes:
  studio-state:
