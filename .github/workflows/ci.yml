name: M1 development quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: m1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web, Rust, contracts, and Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm 10.33.0
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify documentation and SynapseGit contract lock
        run: |
          node scripts/check-synapsegit-contract.mjs
          pnpm check:docs
          pnpm check:evidence

      - name: Check formatting
        run: pnpm format:check

      - name: Check and test web workspace
        run: pnpm check:web

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build all application artifacts
        run: pnpm build

      - name: Run Chromium vertical slice
        run: pnpm test:e2e

      - name: Build and smoke-test the local evaluation package
        run: pnpm verify:package -- --output-dir "${{ runner.temp }}/lp-studio-local-evaluation"

      - name: Verify retained local-package checksums
        working-directory: ${{ runner.temp }}/lp-studio-local-evaluation
        run: sha256sum -c SHA256SUMS

      - name: Retain successful local-evaluation package and evidence
        uses: actions/upload-artifact@v7
        with:
          name: lp-studio-local-evaluation-${{ github.sha }}
          path: ${{ runner.temp }}/lp-studio-local-evaluation/
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
