<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SynapseGit LP Studio blank project" />
    <title>Blank LP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section id="hero" class="hero" data-studio-block="hero">
        <p class="eyebrow">A LOCAL-FIRST LANDING PAGE</p>
        <h1
          id="hero-title"
          data-lp-id="hero-heading"
          data-lp-label="ヒーロー見出し"
        >
          まだ、白紙です。
        </h1>
        <p
          id="hero-copy"
          class="lead"
          data-lp-id="hero-copy"
          data-lp-label="ヒーロー説明文"
        >
          伝えたいことを選び、AIとの対話から最初の一歩をつくります。
        </p>
        <a
          id="hero-cta"
          class="cta"
          href="#next"
          data-lp-id="hero-cta"
          data-lp-label="ヒーローCTA"
          >構想を始める</a
        >
      </section>
      <section id="next" class="next" data-studio-block="next">
        <p>Human reviewの後だけ、変更がAcceptedになります。</p>
      </section>
    </main>
  </body>
</html>
